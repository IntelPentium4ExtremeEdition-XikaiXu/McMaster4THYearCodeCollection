; Q4 packet and ACK errors. Same Ws = 16 as Q3(a). pd fixed at 0.1, pa swept from 0.
; Extra GBN Ws = 8 shows how window size changes the ACK-error effect.

[backend]
exe = /home/xikaixu/Development/McMaster4THYearMatlabs/Lab4_4DK4/ARQSimBackEnd/arq_sim

[experiment]
id = Q4
mode = sweep
outdir = Q4
prefix = q4
title = pd = 0.1, Tout = 15 ms, Ws = 16 unless noted

[fixed]
pd = 0.1
timeout_ms = 15
n = 0
ws = 16
deliver_limit = 20000
seeds = 400440917:400460804,400460804:230411341234134134,230411341234134134:400440917

[x]
key = pa
values = 0,0.05,0.1,0.15,0.2,0.3,0.4,0.5

[series.SW]
label = S&W
ws = 1
wr = 1

[series.GBN8]
label = GBN (Ws = 8)
ws = 8
wr = 1

[series.GBN16]
label = GBN (Ws = 16)
ws = 16
wr = 1

[series.SR4]
label = SR (Ws = 16, Wr = 4)
ws = 16
wr = 4

[series.SR8]
label = SR (Ws = 16, Wr = 8)
ws = 16
wr = 8

[series.SR16]
label = SR (Ws = 16, Wr = 16)
ws = 16
wr = 16

[plot.eff]
y = efficiency
xlabel = ACK error probability pa
ylabel = Link efficiency
theory = sw
outfile = efficiency_vs_pa.png
title = pd = 0.1, Tout = 15 ms

[plot.att]
y = attempts
xlabel = ACK error probability pa
ylabel = Average transmissions per delivered packet
outfile = attempts_vs_pa.png
title = pd = 0.1, Tout = 15 ms
