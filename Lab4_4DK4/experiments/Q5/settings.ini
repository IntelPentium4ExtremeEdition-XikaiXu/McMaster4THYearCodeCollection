; Q5 retransmission timeout. RTT from tx start until ACK returns is 11 ms.
; Sweep covers shorter than 11, just above 11, and much larger than 11.

[backend]
exe = /home/xikaixu/Development/McMaster4THYearMatlabs/Lab4_4DK4/ARQSimBackEnd/arq_sim

[experiment]
id = Q5
mode = sweep
outdir = Q5
prefix = q5
title = pd = 0.1, pa = 0.1, Ws = 16

[fixed]
pd = 0.1
pa = 0.1
n = 0
ws = 16
deliver_limit = 20000
seeds = 400440917:400460804,400460804:230411341234134134,230411341234134134:400440917

[x]
key = timeout_ms
values = 6,8,10,11,12,15,20,30,50,80,120

[series.SW]
label = S&W
ws = 1
wr = 1

[series.GBN]
label = GBN (Ws = 16, Wr = 1)
ws = 16
wr = 1

[series.SR4]
label = SR (Ws = 16, Wr = 4)
ws = 16
wr = 4

[series.SR8]
label = SR (Ws = 16, Wr = 8)
ws = 16
wr = 8

[series.SR16]
label = SR (Ws = 16, Wr = 16)
ws = 16
wr = 16

[plot.eff]
y = efficiency
xlabel = Retransmission timeout Tout (ms)
ylabel = Link efficiency
outfile = efficiency_vs_Tout.png
title = pd = pa = 0.1, GBN/SR Ws = 16 (ACK returns at 11 ms)

[plot.att]
y = attempts
xlabel = Retransmission timeout Tout (ms)
ylabel = Average transmissions per delivered packet
outfile = attempts_vs_Tout.png
title = pd = pa = 0.1, GBN/SR Ws = 16 (ACK returns at 11 ms)
